name: package-theme-demo

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    uses: danjboyd/gnustep-packager/.github/workflows/package-gnustep-app.yml@v0.1.9
    with:
      manifest-path: packaging/package.manifest.json
      backend: appimage
      package-version: ${{ github.ref_name }}
      gnustep-cli-manifest-url: https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.3/release-manifest.json
      run-validation: true
      run-smoke: true
      # The smoke launch opens the app's window, so it needs a display: the
      # hosted runner has none. Start Xvfb and pass DISPLAY to later steps.
      preflight-shell: bash
      preflight-command: |
        sudo apt-get install -y xvfb
        nohup Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
        echo "DISPLAY=:99" >> "$GITHUB_ENV"
      artifact-name: adwaita-theme-demo
