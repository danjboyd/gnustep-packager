name: package-appimage

on:
  workflow_dispatch:

jobs:
  package:
    uses: danjboyd/gnustep-packager/.github/workflows/package-gnustep-app.yml@v0.1.9
    with:
      manifest-path: package.manifest.json
      backend: appimage
      gnustep-cli-manifest-url: https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.5/release-manifest.json
      run-validation: true
      run-smoke: true
      # Also launch the AppImage on hosts with no GNUstep. Fedora has no DejaVu,
      # the font gnustep-back falls back to, so it catches a missing fonts.bundle.
      appimage-clean-smoke-image: "ubuntu:24.04 fedora:42"
      # The smoke launch opens the app's window, so it needs a display: the
      # hosted runner has none. Start Xvfb and pass DISPLAY to later steps.
      preflight-shell: bash
      preflight-command: |
        sudo apt-get install -y xvfb
        nohup Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
        echo "DISPLAY=:99" >> "$GITHUB_ENV"
      artifact-name: gnustep-app
