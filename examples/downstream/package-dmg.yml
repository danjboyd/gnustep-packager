name: package-macos-dmg

# Builds, stages, packages and validates a macOS DMG with the dmg backend,
# through the reusable workflow on a GitHub-hosted macOS runner.
#
# Ad-hoc builds need no secrets: keep backends.dmg.signing.identity "-" and
# sign-artifacts false. For a Developer ID build, set the identity and
# backends.dmg.notarization in the manifest, set sign-artifacts true, and
# provide the secrets below; the notary profile name is exported in the
# variable backends.dmg.notarization.keychainProfileEnvVar names.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package-macos:
    uses: <owner>/gnustep-packager/.github/workflows/package-gnustep-app.yml@main
    with:
      manifest-path: package.manifest.json
      backend: dmg
      package-version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run-validation: true
      run-smoke: true
      sign-artifacts: false
      artifact-name: macos-dmg
    secrets:
      macos_certificate_p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      macos_certificate_password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      notary_apple_id: ${{ secrets.NOTARY_APPLE_ID }}
      notary_team_id: ${{ secrets.NOTARY_TEAM_ID }}
      notary_app_password: ${{ secrets.NOTARY_APP_PASSWORD }}
