name: hosted-examples-clean

# Runs the gnustep-apps examples' package-appimage.yml as a consumer would
# (reusable workflow @v0.1.8, gnustep-cli-new v0.1.3), one app per job.
# Test branch only: build-app.sh and stage-app.sh are copied beside each
# manifest, the layout examples/downstream/gnustep-apps/README.md describes.
on:
  push:
    branches:
      - hosted-examples-clean
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        app: [gorm, projectcenter, gworkspace, systempreferences, terminal]
    uses: danjboyd/gnustep-packager/.github/workflows/package-gnustep-app.yml@v0.1.9
    with:
      manifest-path: examples/downstream/gnustep-apps/${{ matrix.app }}/package.manifest.json
      backend: appimage
      gnustep-cli-manifest-url: https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.3/release-manifest.json
      run-validation: true
      run-smoke: true
      # Also launch each AppImage on hosts with no GNUstep at all.
      appimage-clean-smoke-image: "ubuntu:24.04 fedora:42"
      preflight-shell: bash
      preflight-command: |
        sudo apt-get install -y xvfb
        nohup Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
        echo "DISPLAY=:99" >> "$GITHUB_ENV"
      artifact-name: gnustep-app-${{ matrix.app }}
