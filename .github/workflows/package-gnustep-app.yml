name: package-gnustep-app

on:
  workflow_call:
    inputs:
      manifest-path:
        required: true
        type: string
      backend:
        required: false
        type: string
        default: msi
      package-version:
        required: false
        type: string
        default: ""
      packager-repository:
        required: false
        type: string
        default: ""
      packager-ref:
        required: false
        type: string
        default: ""
      runs-on-msi:
        required: false
        type: string
        default: '["windows-latest"]'
      # Pinned rather than ubuntu-latest: the build image sets the AppImage's
      # glibc floor and must be one gnustep-cli-new publishes for, so a new
      # image is something callers opt into, not something that moves under
      # them. See docs/github-actions.md.
      runs-on-appimage:
        required: false
        type: string
        default: '["ubuntu-24.04"]'
      runs-on-dmg:
        required: false
        type: string
        default: '["macos-latest"]'
      # An image to run the AppImage job in (with PowerShell and the
      # AppImage tools); usually with skip-default-host-setup: true. GHCR
      # images get the workflow token as their registry login.
      container-appimage:
        required: false
        type: string
        default: ""
      skip-default-host-setup:
        required: false
        type: boolean
        default: false
      msys2-packages:
        required: false
        type: string
        default: ""
      # .pkg.tar.zst URLs of CLANG64 packages that replace MSYS2's own, such
      # as a GNUstep library carrying fixes ahead of its release. Installed
      # into the MSYS2 shell with pacman -U and laid over the gnustep-cli-new
      # toolchain, which is what the MSI stages.
      msys2-package-urls:
        required: false
        type: string
        default: ""
      appimage-apt-packages:
        required: false
        type: string
        default: "ca-certificates curl tar gzip squashfs-tools desktop-file-utils"
      gnustep-cli-manifest-url:
        required: false
        type: string
        default: "https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.3/release-manifest.json"
      gnustep-cli-bootstrap-url:
        required: false
        type: string
        default: "https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.3/gnustep-bootstrap.sh"
      # SHA-256 digests of the bootstrap scripts the gnustep-cli-bootstrap-url
      # default names (gnustep-bootstrap.sh for AppImage, the .ps1 beside it
      # for MSI). The download must match before it runs. A caller that
      # overrides gnustep-cli-bootstrap-url sets the matching digest, or ""
      # to skip the check.
      gnustep-cli-bootstrap-sha256:
        required: false
        type: string
        default: "26ac6763fcc9dd6a86bf1d43dba140c45b84737ecb4fa3c1d1ef43d9fa437406"
      gnustep-cli-bootstrap-ps1-sha256:
        required: false
        type: string
        default: "ef9159c6f27d272eea6f9525029da584def3a88b89d4ce403b37b42f9f374150"
      gnustep-cli-root:
        required: false
        type: string
        default: ""
      preflight-shell:
        required: false
        type: string
        default: pwsh
      preflight-command:
        required: false
        type: string
        default: ""
      run-validation:
        required: false
        type: boolean
        default: true
      run-smoke:
        required: false
        type: boolean
        default: false
      appimage-clean-smoke-image:
        description: >-
          AppImage only: also launch the AppImage in these container images (apt- or dnf-based,
          separated by spaces, for example "ubuntu:24.04 fedora:42"), which have no GNUstep, so a
          package that only works where the build host's GNUstep is installed fails here. Each
          gets its distribution's default UI fonts. Needs Docker on the runner (not with
          container-appimage). Empty skips it.
        required: false
        type: string
        default: ""
      upload-artifacts:
        required: false
        type: boolean
        default: true
      artifact-name:
        required: false
        type: string
        default: gnustep-package
      artifact-retention-days:
        required: false
        type: number
        default: 7
      sign-artifacts:
        required: false
        type: boolean
        default: false
      sign-timestamp-url:
        required: false
        type: string
        default: ""
    secrets:
      consumer_checkout_token:
        required: false
      sign_pfx_base64:
        required: false
      sign_pfx_password:
        required: false
      sign_cert_sha1:
        required: false
      # DMG signing and notarization (backend: dmg, sign-artifacts: true): a
      # Developer ID Application certificate as base64 .p12 and its password,
      # and optionally the Apple ID, team ID and app-specific password that
      # notarytool stores as a keychain profile.
      macos_certificate_p12:
        required: false
      macos_certificate_password:
        required: false
      notary_apple_id:
        required: false
      notary_team_id:
        required: false
      notary_app_password:
        required: false
    outputs:
      resolved-version:
        description: Resolved package version after defaults and optional override.
        value: ${{ jobs.package.outputs.resolved-version }}
      package-root:
        description: Resolved package output root.
        value: ${{ jobs.package.outputs.package-root }}
      log-root:
        description: Resolved log output root.
        value: ${{ jobs.package.outputs.log-root }}
      validation-root:
        description: Resolved validation output root.
        value: ${{ jobs.package.outputs.validation-root }}

jobs:
  package:
    runs-on: ${{ fromJSON(inputs.backend == 'appimage' && inputs.runs-on-appimage || (inputs.backend == 'dmg' && inputs.runs-on-dmg || inputs.runs-on-msi)) }}
    container: ${{ (inputs.backend == 'appimage' && startsWith(inputs.container-appimage, 'ghcr.io/')) && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}}}}', inputs.container-appimage, github.actor, github.token)) || (inputs.backend == 'appimage' && inputs.container-appimage) || '' }}
    outputs:
      resolved-version: ${{ steps.manifest.outputs.resolved_version }}
      package-root: ${{ steps.manifest.outputs.package_root }}
      log-root: ${{ steps.manifest.outputs.log_root }}
      validation-root: ${{ steps.manifest.outputs.validation_root }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Consumer Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.consumer_checkout_token || github.token }}

      - name: Resolve Packager Checkout
        id: packager
        run: |
          $repository = '${{ inputs.packager-repository }}'
          $ref = '${{ inputs.packager-ref }}'
          if (-not [string]::IsNullOrWhiteSpace($repository) -and -not [string]::IsNullOrWhiteSpace($ref)) {
            "repository=$repository" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          # github.workflow_ref names the caller's workflow inside a workflow_call;
          # job.workflow_* names this reusable workflow, so use it to check out
          # the exact packager commit the caller pinned in `uses:`.
          $workflowRepository = '${{ job.workflow_repository }}'
          $workflowSha = '${{ job.workflow_sha }}'
          if ([string]::IsNullOrWhiteSpace($workflowRepository) -or [string]::IsNullOrWhiteSpace($workflowSha)) {
            throw "Unable to resolve packager checkout: job.workflow_repository/job.workflow_sha are unavailable on this runner (for example GitHub Enterprise Server). Provide packager-repository and packager-ref inputs."
          }
          "repository=$workflowRepository" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ref=$workflowSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout Packager Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.packager.outputs.repository }}
          ref: ${{ steps.packager.outputs.ref }}
          path: .gnustep-packager-toolkit

      - name: Resolve Manifest Outputs And Host Dependencies
        id: manifest
        run: |
          $toolRoot = Join-Path $env:GITHUB_WORKSPACE ".gnustep-packager-toolkit"
          $manifestPath = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '${{ inputs.manifest-path }}'))
          $coreScript = [System.IO.Path]::GetFullPath((Join-Path $toolRoot 'scripts\lib\core.ps1'))
          if (-not (Test-Path -LiteralPath $coreScript)) {
            throw "gnustep-packager core library not found at $coreScript"
          }
          . $coreScript
          $context = Get-GpManifestContext -Path $manifestPath -PackageVersion '${{ inputs.package-version }}'
          $manifest = $context.Manifest
          $manifestRoot = Split-Path -Parent $manifestPath
          $hostSetupPlanArgs = @{
            Context = $context
            Backend = '${{ inputs.backend }}'
            AdditionalMsys2Packages = '${{ inputs.msys2-packages }}'
            Msys2PackageUrls = '${{ inputs.msys2-package-urls }}'
            AdditionalAptPackages = '${{ inputs.appimage-apt-packages }}'
          }
          if ($${{ inputs.skip-default-host-setup }}) {
            $hostSetupPlanArgs.SkipDefaultHostSetup = $true
          }
          $hostSetupPlan = Get-GpWorkflowHostSetupPlan @hostSetupPlanArgs

          if (@($hostSetupPlan.Errors).Count -gt 0) {
            throw ([string]::Join(" ", @($hostSetupPlan.Errors)))
          }

          function Resolve-OutputPath([string]$basePath, [string]$value) {
            if ([System.IO.Path]::IsPathRooted($value)) {
              return [System.IO.Path]::GetFullPath($value)
            }
            return [System.IO.Path]::GetFullPath((Join-Path $basePath $value))
          }

          "resolved_version=$($manifest.package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "package_root=$(Resolve-OutputPath $manifestRoot $manifest.outputs.packageRoot)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "log_root=$(Resolve-OutputPath $manifestRoot $manifest.outputs.logRoot)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "validation_root=$(Resolve-OutputPath $manifestRoot $manifest.outputs.validationRoot)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest_msys2_packages=$($hostSetupPlan.ManifestMsys2PackageText)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest_apt_packages=$($hostSetupPlan.ManifestAptPackageText)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "resolved_msys2_packages=$($hostSetupPlan.ResolvedMsys2PackageText)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "resolved_apt_packages=$($hostSetupPlan.ResolvedAptPackageText)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "host_setup_mode=$($hostSetupPlan.HostSetupMode)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "host_setup_summary=$($hostSetupPlan.Summary)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notaryProfileEnvVar = ""
          if ($manifest.Contains("backends") -and $manifest["backends"].Contains("dmg") -and $manifest["backends"]["dmg"].Contains("notarization") -and
              $manifest["backends"]["dmg"]["notarization"].Contains("keychainProfileEnvVar")) {
            $notaryProfileEnvVar = [string]$manifest["backends"]["dmg"]["notarization"]["keychainProfileEnvVar"]
          }
          "dmg_notary_profile_env_var=$notaryProfileEnvVar" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host $hostSetupPlan.Summary

      - name: Install MSYS2 Bootstrap Shell
        if: ${{ inputs.backend == 'msi' && !inputs.skip-default-host-setup }}
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            curl
            tar
            gzip
            ${{ steps.manifest.outputs.resolved_msys2_packages }}

      - name: Expose MSYS2 Toolchain
        if: ${{ inputs.backend == 'msi' && !inputs.skip-default-host-setup }}
        run: |
          "MSYS2_LOCATION=${{ steps.msys2.outputs.msys2-location }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'clang64\bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Bootstrap And Smoke Test gnustep-cli-new For MSI
        if: ${{ inputs.backend == 'msi' && !inputs.skip-default-host-setup }}
        shell: pwsh
        timeout-minutes: 30
        env:
          GP_GNUSTEP_CLI_MANIFEST_URL: ${{ inputs.gnustep-cli-manifest-url }}
          GP_GNUSTEP_CLI_BOOTSTRAP_URL: ${{ inputs.gnustep-cli-bootstrap-url }}
          GP_GNUSTEP_CLI_BOOTSTRAP_SHA256: ${{ inputs.gnustep-cli-bootstrap-sha256 }}
          GP_GNUSTEP_CLI_BOOTSTRAP_PS1_SHA256: ${{ inputs.gnustep-cli-bootstrap-ps1-sha256 }}
          GP_GNUSTEP_CLI_ROOT: ${{ inputs.gnustep-cli-root }}
          GP_GNUSTEP_CLI_LOG_ROOT: ${{ steps.manifest.outputs.log_root }}\gnustep-cli-new
          GP_GNUSTEP_CLI_SMOKE_ROOT: ${{ runner.temp }}\gnustep-cli-new-smoke
          GP_GNUSTEP_CLI_HOST_KIND: windows-msys2-clang64
        run: |
          $ErrorActionPreference = "Stop"

          function Stop-ProcessTree {
            param(
              [Parameter(Mandatory = $true)][System.Diagnostics.Process]$Process
            )
            if ($Process.HasExited) {
              return
            }
            try {
              & taskkill.exe /PID $Process.Id /T /F | Out-Host
            }
            catch {
              try {
                Stop-Process -Id $Process.Id -Force -ErrorAction Stop
              }
              catch {
                Write-Warning "Unable to stop process $($Process.Id): $($_.Exception.Message)"
              }
            }
          }

          function Append-ProcessOutput {
            param(
              [Parameter(Mandatory = $true)][string]$LogPath,
              [Parameter(Mandatory = $true)][string]$StdOutPath,
              [Parameter(Mandatory = $true)][string]$StdErrPath
            )
            if (Test-Path -LiteralPath $StdOutPath) {
              Add-Content -Path $LogPath -Value ""
              Add-Content -Path $LogPath -Value "## stdout"
              Get-Content -LiteralPath $StdOutPath | Add-Content -Path $LogPath
            }
            if (Test-Path -LiteralPath $StdErrPath) {
              Add-Content -Path $LogPath -Value ""
              Add-Content -Path $LogPath -Value "## stderr"
              Get-Content -LiteralPath $StdErrPath | Add-Content -Path $LogPath
            }
          }

          function Invoke-LoggedProcess {
            param(
              [Parameter(Mandatory = $true)][string]$LogPath,
              [Parameter(Mandatory = $true)][string]$FilePath,
              [string[]]$ArgumentList = @(),
              [string]$WorkingDirectory = "",
              [int]$TimeoutSeconds = 600,
              [int]$HeartbeatSeconds = 30
            )
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $LogPath) | Out-Null
            $stdoutPath = "$LogPath.stdout.tmp"
            $stderrPath = "$LogPath.stderr.tmp"
            Remove-Item -Force -ErrorAction SilentlyContinue $stdoutPath, $stderrPath
            $commandLine = "$FilePath $([string]::Join(' ', $ArgumentList))"
            Set-Content -Path $LogPath -Value @(
              "timestamp=$([DateTimeOffset]::UtcNow.ToString("o"))",
              "command=$commandLine",
              "working_directory=$WorkingDirectory",
              "timeout_seconds=$TimeoutSeconds"
            ) -Encoding UTF8
            Write-Host "RUN $commandLine"

            $parameters = @{
              FilePath = $FilePath
              ArgumentList = $ArgumentList
              PassThru = $true
              NoNewWindow = $true
              RedirectStandardOutput = $stdoutPath
              RedirectStandardError = $stderrPath
            }
            if (-not [string]::IsNullOrWhiteSpace($WorkingDirectory)) {
              $parameters.WorkingDirectory = $WorkingDirectory
            }
            $process = Start-Process @parameters
            $deadline = [DateTimeOffset]::UtcNow.AddSeconds([Math]::Max($TimeoutSeconds, 1))
            $lastHeartbeat = [DateTimeOffset]::UtcNow
            try {
              while (-not $process.HasExited) {
                Start-Sleep -Seconds 2
                $now = [DateTimeOffset]::UtcNow
                if (($now - $lastHeartbeat).TotalSeconds -ge $HeartbeatSeconds) {
                  $message = "heartbeat=$($now.ToString("o")) pid=$($process.Id) elapsed_seconds=$([int](($now - ($deadline.AddSeconds(-1 * [Math]::Max($TimeoutSeconds, 1)))).TotalSeconds))"
                  Write-Host $message
                  Add-Content -Path $LogPath -Value $message
                  $lastHeartbeat = $now
                }
                if ($now -ge $deadline) {
                  $message = "ERROR: timed out after $TimeoutSeconds seconds"
                  Write-Host $message
                  Add-Content -Path $LogPath -Value $message
                  Stop-ProcessTree -Process $process
                  $process.WaitForExit()
                  Append-ProcessOutput -LogPath $LogPath -StdOutPath $stdoutPath -StdErrPath $stderrPath
                  throw $message
                }
              }

              $process.WaitForExit()
              Append-ProcessOutput -LogPath $LogPath -StdOutPath $stdoutPath -StdErrPath $stderrPath
              Add-Content -Path $LogPath -Value "exit_code=$($process.ExitCode)"
              if ([int]$process.ExitCode -ne 0) {
                throw "command exited with $($process.ExitCode)"
              }
            }
            catch {
              "ERROR: $($_.Exception.Message)" | Tee-Object -FilePath $LogPath -Append
              throw
            }
            finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $stdoutPath, $stderrPath
            }
          }

          function Write-BootstrapReport {
            param([string]$Status)
            $reportPath = Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-blocker-report.md"
            $logFiles = @(
              "gnustep-cli-new-host-context.log",
              "gnustep-cli-new-selection.log",
              "gnustep-cli-new-bootstrap-download.log",
              "gnustep-cli-new-setup.log",
              "gnustep-cli-new-path-context.log",
              "gnustep-cli-new-version.log",
              "gnustep-cli-new-doctor.json",
              "gnustep-cli-new-new.json",
              "gnustep-cli-new-build.json",
              "gnustep-cli-new-run.json"
            )
            $lines = [System.Collections.Generic.List[string]]::new()
            $lines.Add("# gnustep-cli-new Bootstrap Report")
            $lines.Add("")
            $lines.Add("- status: $Status")
            $lines.Add("- host: $([System.Environment]::OSVersion.VersionString)")
            $lines.Add("- manifest: $env:GP_GNUSTEP_CLI_MANIFEST_URL")
            $lines.Add("- bootstrap: $env:GP_GNUSTEP_CLI_BOOTSTRAP_URL")
            $lines.Add("- install root: $env:GP_GNUSTEP_CLI_ROOT")
            $lines.Add("- host kind: $env:GP_GNUSTEP_CLI_HOST_KIND")
            $lines.Add("- log root: $env:GP_GNUSTEP_CLI_LOG_ROOT")
            $lines.Add("")
            foreach ($name in $logFiles) {
              $path = Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT $name
              if (-not (Test-Path -LiteralPath $path)) { continue }
              $lines.Add("## $name")
              $lines.Add("")
              $lines.Add("``````text")
              $lines.AddRange([string[]](Get-Content -LiteralPath $path -Tail 120))
              $lines.Add("``````")
              $lines.Add("")
            }
            Set-Content -Path $reportPath -Value $lines -Encoding UTF8
          }

          if ([string]::IsNullOrWhiteSpace($env:GP_GNUSTEP_CLI_ROOT)) {
            $env:GP_GNUSTEP_CLI_ROOT = Join-Path '${{ runner.temp }}' 'gnustep-cli-new'
          }
          New-Item -ItemType Directory -Force -Path $env:GP_GNUSTEP_CLI_LOG_ROOT | Out-Null
          New-Item -ItemType Directory -Force -Path $env:GP_GNUSTEP_CLI_SMOKE_ROOT | Out-Null

          @(
            "timestamp=$([DateTimeOffset]::UtcNow.ToString("o"))",
            "runner_os=$env:RUNNER_OS",
            "host_kind=$env:GP_GNUSTEP_CLI_HOST_KIND",
            "github_workflow=$env:GITHUB_WORKFLOW",
            "github_run_id=$env:GITHUB_RUN_ID",
            "github_ref=$env:GITHUB_REF",
            "install_root=$env:GP_GNUSTEP_CLI_ROOT",
            "log_root=$env:GP_GNUSTEP_CLI_LOG_ROOT",
            "smoke_root=$env:GP_GNUSTEP_CLI_SMOKE_ROOT",
            "msys2_location=${{ steps.msys2.outputs.msys2-location }}",
            "",
            "PATH entries:",
            ($env:PATH -split ';' -join [Environment]::NewLine)
          ) | Set-Content -Path (Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-host-context.log") -Encoding UTF8

          $bootstrapUrl = $env:GP_GNUSTEP_CLI_BOOTSTRAP_URL -replace 'gnustep-bootstrap\.sh$', 'gnustep-bootstrap.ps1'
          $bootstrapPath = Join-Path $env:GP_GNUSTEP_CLI_SMOKE_ROOT "gnustep-bootstrap.ps1"
          @(
            "gnustep-cli-new manifest: $env:GP_GNUSTEP_CLI_MANIFEST_URL",
            "gnustep-cli-new bootstrap: $bootstrapUrl",
            "gnustep-cli-new root: $env:GP_GNUSTEP_CLI_ROOT"
          ) | Tee-Object -FilePath (Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-selection.log")

          try {
            Invoke-LoggedProcess `
              -LogPath (Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-bootstrap-download.log") `
              -FilePath "curl.exe" `
              -ArgumentList @("--fail", "--location", "--show-error", "--connect-timeout", "30", "--max-time", "300", "--output", $bootstrapPath, $bootstrapUrl) `
              -TimeoutSeconds 360
            $expectedSha256 = $env:GP_GNUSTEP_CLI_BOOTSTRAP_PS1_SHA256
            if (-not [string]::IsNullOrWhiteSpace($expectedSha256)) {
              $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $bootstrapPath).Hash
              "gnustep-bootstrap.ps1 sha256: $actualSha256 (expected $expectedSha256)" |
                Tee-Object -FilePath (Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-bootstrap-download.log") -Append
              if ($actualSha256 -ne $expectedSha256.Trim()) {
                throw "gnustep-bootstrap.ps1 sha256 mismatch: got $actualSha256, expected $expectedSha256. Set gnustep-cli-bootstrap-ps1-sha256 to the digest of $bootstrapUrl, or to an empty string to skip the check."
              }
            }
            Invoke-LoggedProcess `
              -LogPath (Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-setup.log") `
              -FilePath "pwsh" `
              -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $bootstrapPath, "--json", "--yes", "setup", "--user", "--root", $env:GP_GNUSTEP_CLI_ROOT, "--manifest", $env:GP_GNUSTEP_CLI_MANIFEST_URL) `
              -TimeoutSeconds 1200

            $toolPaths = @(
              (Join-Path $env:GP_GNUSTEP_CLI_ROOT "bin"),
              (Join-Path $env:GP_GNUSTEP_CLI_ROOT "Tools"),
              (Join-Path $env:GP_GNUSTEP_CLI_ROOT "System\Tools"),
              (Join-Path $env:GP_GNUSTEP_CLI_ROOT "usr\bin"),
              (Join-Path $env:GP_GNUSTEP_CLI_ROOT "clang64\bin")
            )
            $env:PATH = ([string]::Join(';', $toolPaths + @($env:PATH)))
            @(
              "timestamp=$([DateTimeOffset]::UtcNow.ToString("o"))",
              "PATH entries:",
              ($env:PATH -split ';' -join [Environment]::NewLine),
              "",
              "command lookup:",
              "gnustep=$((Get-Command gnustep -ErrorAction SilentlyContinue).Source)",
              "bash=$((Get-Command bash -ErrorAction SilentlyContinue).Source)",
              "make=$((Get-Command make -ErrorAction SilentlyContinue).Source)",
              "clang=$((Get-Command clang -ErrorAction SilentlyContinue).Source)"
            ) | Set-Content -Path (Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-path-context.log") -Encoding UTF8

            Invoke-LoggedProcess -LogPath (Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-version.log") -FilePath "gnustep" -ArgumentList @("--version") -TimeoutSeconds 120
            Invoke-LoggedProcess -LogPath (Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-doctor.json") -FilePath "gnustep" -ArgumentList @("doctor", "--json", "--manifest", $env:GP_GNUSTEP_CLI_MANIFEST_URL) -TimeoutSeconds 180

            $workRoot = Join-Path $env:GP_GNUSTEP_CLI_SMOKE_ROOT "work"
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $workRoot
            New-Item -ItemType Directory -Force -Path $workRoot | Out-Null
            Push-Location $workRoot
            try {
              Invoke-LoggedProcess -LogPath (Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-new.json") -FilePath "gnustep" -ArgumentList @("new", "cli-tool", "HelloPackager", "--json") -WorkingDirectory $workRoot -TimeoutSeconds 180
              $projectRoot = Join-Path $workRoot "HelloPackager"
              Push-Location $projectRoot
              try {
                Invoke-LoggedProcess -LogPath (Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-build.json") -FilePath "gnustep" -ArgumentList @("build", "--json") -WorkingDirectory $projectRoot -TimeoutSeconds 600
                $helloExe = Join-Path (Join-Path $projectRoot "obj") "HelloPackager.exe"
                if (!(Test-Path -LiteralPath $helloExe)) {
                  @(
                    "timestamp=$([DateTimeOffset]::UtcNow.ToString("o"))",
                    "expected_executable=$helloExe",
                    "ERROR: expected Windows smoke executable was not produced by gnustep build"
                  ) | Set-Content -Path (Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-run.json") -Encoding UTF8
                  throw "Expected Windows smoke executable was not produced: $helloExe"
                }
                Invoke-LoggedProcess -LogPath (Join-Path $env:GP_GNUSTEP_CLI_LOG_ROOT "gnustep-cli-new-run.json") -FilePath $helloExe -ArgumentList @() -WorkingDirectory $projectRoot -TimeoutSeconds 180
              }
              finally {
                Pop-Location
              }
            }
            finally {
              Pop-Location
            }
            Write-BootstrapReport "passed"
          }
          catch {
            Write-BootstrapReport "failed"
            throw
          }

          $toolPaths | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "GP_GNUSTEP_CLI_ROOT=$env:GP_GNUSTEP_CLI_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GP_GNUSTEP_CLI_MANIFEST_URL=$env:GP_GNUSTEP_CLI_MANIFEST_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MSYS2_LOCATION=${{ steps.msys2.outputs.msys2-location }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Carried MSYS2 Packages
        if: ${{ inputs.backend == 'msi' && !inputs.skip-default-host-setup && inputs.msys2-package-urls != '' }}
        shell: pwsh
        env:
          GP_MSYS2_PACKAGE_URLS: ${{ inputs.msys2-package-urls }}
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE '.gnustep-packager-toolkit\scripts\lib\core.ps1')
          $msysRoot = '${{ steps.msys2.outputs.msys2-location }}'
          $bash = Join-Path $msysRoot 'usr\bin\bash.exe'
          $tar = Join-Path $msysRoot 'usr\bin\tar.exe'
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'gp-msys2-packages'
          New-Item -ItemType Directory -Force -Path $downloadRoot | Out-Null

          foreach ($url in @($env:GP_MSYS2_PACKAGE_URLS -split '\s+' | Where-Object { $_ })) {
            $package = Join-Path $downloadRoot ([System.IO.Path]::GetFileName(([uri]$url).AbsolutePath))
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $package

            # The MSYS2 shell the workflow set up, for anything built against it.
            $env:MSYSTEM = 'CLANG64'
            & $bash -lc "pacman -U --noconfirm '$($package -replace '\\', '/')'"
            if ($LASTEXITCODE -ne 0) {
              throw "pacman -U failed for $package (exit $LASTEXITCODE)."
            }

            # The gnustep-cli-new toolchain: the runtime the MSI stages.
            if (-not [string]::IsNullOrWhiteSpace($env:GP_GNUSTEP_CLI_ROOT) -and (Test-Path -LiteralPath $env:GP_GNUSTEP_CLI_ROOT)) {
              $overlay = Install-GpMsys2PackageOverlay -PackagePath $package -Root $env:GP_GNUSTEP_CLI_ROOT -TarPath $tar
              Write-Host "Laid $(@($overlay.Files).Count) files from $([System.IO.Path]::GetFileName($package)) over: $([string]::Join(', ', @($overlay.Targets)))"
            }
          }

      - name: Install Linux AppImage Prerequisites
        if: ${{ inputs.backend == 'appimage' && !inputs.skip-default-host-setup }}
        shell: bash
        run: |
          set -euo pipefail
          packages='${{ steps.manifest.outputs.resolved_apt_packages }}'
          if [ -z "$packages" ]; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y $packages

      - name: Bootstrap And Smoke Test gnustep-cli-new
        if: ${{ inputs.backend == 'appimage' && !inputs.skip-default-host-setup }}
        shell: bash
        env:
          GP_GNUSTEP_CLI_MANIFEST_URL: ${{ inputs.gnustep-cli-manifest-url }}
          GP_GNUSTEP_CLI_BOOTSTRAP_URL: ${{ inputs.gnustep-cli-bootstrap-url }}
          GP_GNUSTEP_CLI_BOOTSTRAP_SHA256: ${{ inputs.gnustep-cli-bootstrap-sha256 }}
          GP_GNUSTEP_CLI_BOOTSTRAP_PS1_SHA256: ${{ inputs.gnustep-cli-bootstrap-ps1-sha256 }}
          GP_GNUSTEP_CLI_ROOT: ${{ inputs.gnustep-cli-root }}
          GP_GNUSTEP_CLI_LOG_ROOT: ${{ steps.manifest.outputs.log_root }}/gnustep-cli-new
          GP_GNUSTEP_CLI_SMOKE_ROOT: ${{ runner.temp }}/gnustep-cli-new-smoke
          GP_GNUSTEP_CLI_HOST_KIND: linux-ubuntu-appimage
        run: |
          set -euo pipefail
          if [ -z "${GP_GNUSTEP_CLI_ROOT:-}" ]; then
            GP_GNUSTEP_CLI_ROOT="${RUNNER_TEMP}/gnustep-cli-new"
            export GP_GNUSTEP_CLI_ROOT
          fi
          ./.gnustep-packager-toolkit/scripts/ci/gnustep-cli-new-bootstrap-smoke.sh
          {
            echo "${GP_GNUSTEP_CLI_ROOT}/bin"
            echo "${GP_GNUSTEP_CLI_ROOT}/Tools"
            echo "${GP_GNUSTEP_CLI_ROOT}/System/Tools"
          } >> "$GITHUB_PATH"
          {
            echo "GP_GNUSTEP_CLI_ROOT=${GP_GNUSTEP_CLI_ROOT}"
            echo "GP_GNUSTEP_CLI_MANIFEST_URL=${GP_GNUSTEP_CLI_MANIFEST_URL}"
          } >> "$GITHUB_ENV"

      - name: Run Caller Preflight (pwsh)
        if: ${{ inputs.preflight-command != '' && inputs.preflight-shell == 'pwsh' }}
        shell: pwsh
        run: |
          ${{ inputs.preflight-command }}

      - name: Run Caller Preflight (bash)
        if: ${{ inputs.preflight-command != '' && inputs.preflight-shell == 'bash' }}
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.preflight-command }}

      - name: Configure Signing Environment
        if: ${{ inputs.sign-artifacts && inputs.backend == 'msi' }}
        run: |
          "GP_SIGN_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.sign-timestamp-url }}')) {
            "GP_SIGN_TIMESTAMP_URL=${{ inputs.sign-timestamp-url }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          if (-not [string]::IsNullOrWhiteSpace('${{ secrets.sign_cert_sha1 }}')) {
            "GP_SIGN_CERT_SHA1=${{ secrets.sign_cert_sha1 }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          if (-not [string]::IsNullOrWhiteSpace('${{ secrets.sign_pfx_password }}')) {
            "GP_SIGN_PFX_PASSWORD=${{ secrets.sign_pfx_password }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          if (-not [string]::IsNullOrWhiteSpace('${{ secrets.sign_pfx_base64 }}')) {
            $tempRoot = Join-Path $env:RUNNER_TEMP "gnustep-packager-signing"
            New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null
            $pfxPath = Join-Path $tempRoot "codesign.pfx"
            $pfxBytes = [System.Convert]::FromBase64String('${{ secrets.sign_pfx_base64 }}')
            [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            "GP_SIGN_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      # A temporary keychain with the Developer ID certificate, and the
      # notarytool profile named by backends.dmg.notarization.keychainProfileEnvVar.
      # The manifest decides the identity and whether to notarize; without
      # notary secrets the DMG is signed but not notarized.
      - name: Configure macOS Signing
        if: ${{ inputs.sign-artifacts && inputs.backend == 'dmg' }}
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.macos_certificate_p12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.macos_certificate_password }}
          NOTARY_APPLE_ID: ${{ secrets.notary_apple_id }}
          NOTARY_TEAM_ID: ${{ secrets.notary_team_id }}
          NOTARY_APP_PASSWORD: ${{ secrets.notary_app_password }}
          NOTARY_PROFILE_ENV_VAR: ${{ steps.manifest.outputs.dmg_notary_profile_env_var }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_P12}" ]; then
            echo "sign-artifacts with backend dmg needs the macos_certificate_p12 secret" >&2
            exit 1
          fi
          keychain="${RUNNER_TEMP}/gnustep-packager-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          echo "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${RUNNER_TEMP}/gnustep-packager-cert.p12"
          security import "${RUNNER_TEMP}/gnustep-packager-cert.p12" -k "${keychain}" -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          rm -f "${RUNNER_TEMP}/gnustep-packager-cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" >/dev/null
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          echo "GP_SIGNING_KEYCHAIN=${keychain}" >> "${GITHUB_ENV}"
          if [ -n "${NOTARY_APPLE_ID}" ] && [ -n "${NOTARY_TEAM_ID}" ] && [ -n "${NOTARY_APP_PASSWORD}" ]; then
            if [ -z "${NOTARY_PROFILE_ENV_VAR}" ]; then
              echo "notary secrets are set, but the manifest has no backends.dmg.notarization.keychainProfileEnvVar" >&2
              exit 1
            fi
            xcrun notarytool store-credentials gnustep-packager-notary --apple-id "${NOTARY_APPLE_ID}" \
              --team-id "${NOTARY_TEAM_ID}" --password "${NOTARY_APP_PASSWORD}" --keychain "${keychain}"
            echo "${NOTARY_PROFILE_ENV_VAR}=gnustep-packager-notary" >> "${GITHUB_ENV}"
          else
            echo "No notary secrets: the DMG is signed but not notarized."
          fi

      - name: Run Packaging Pipeline
        run: |
          $toolRoot = Join-Path $env:GITHUB_WORKSPACE ".gnustep-packager-toolkit"
          $manifestPath = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '${{ inputs.manifest-path }}'))
          $parameters = @{
            Manifest = $manifestPath
            Backend = '${{ inputs.backend }}'
          }
          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.package-version }}')) {
            $parameters['PackageVersion'] = '${{ inputs.package-version }}'
          }
          if ('${{ inputs.run-validation }}' -ne 'true') {
            $parameters['SkipBackendValidation'] = $true
          }
          if ('${{ inputs.run-smoke }}' -eq 'true') {
            $parameters['RunSmoke'] = $true
          }
          if ('${{ inputs.skip-default-host-setup }}' -ne 'true') {
            $parameters['InstallHostDependencies'] = $true
          }
          $pipelineScript = [System.IO.Path]::GetFullPath((Join-Path $toolRoot 'scripts\run-packaging-pipeline.ps1'))
          if (-not (Test-Path -LiteralPath $pipelineScript)) {
            throw "packaging pipeline entrypoint not found at $pipelineScript"
          }
          & $pipelineScript @parameters

      - name: Smoke Test AppImage On A Clean Host
        if: ${{ inputs.backend == 'appimage' && inputs.appimage-clean-smoke-image != '' }}
        shell: bash
        env:
          CLEAN_SMOKE_IMAGE: ${{ inputs.appimage-clean-smoke-image }}
          PACKAGE_ROOT: ${{ steps.manifest.outputs.package_root }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=("${PACKAGE_ROOT}"/*.AppImage)
          if [ "${#appimages[@]}" -eq 0 ]; then
            echo "No AppImage in ${PACKAGE_ROOT}" >&2
            exit 1
          fi
          read -r -a images <<<"${CLEAN_SMOKE_IMAGE}"
          for appimage in "${appimages[@]}"; do
            for image in "${images[@]}"; do
              ./.gnustep-packager-toolkit/scripts/ci/appimage-clean-smoke.sh "${appimage}" "${image}"
            done
          done

      - name: Remove macOS Signing Keychain
        if: ${{ always() && inputs.sign-artifacts && inputs.backend == 'dmg' }}
        shell: bash
        run: |
          if [ -n "${GP_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "${GP_SIGNING_KEYCHAIN}" || true
          fi

      - name: Upload Package Artifacts
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-packages
          path: ${{ steps.manifest.outputs.package_root }}
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error

      - name: Upload Logs
        if: ${{ always() && inputs.upload-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-logs
          path: ${{ steps.manifest.outputs.log_root }}
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: warn

      - name: Upload gnustep-cli-new Diagnostics
        if: ${{ always() && inputs.upload-artifacts && inputs.backend != 'dmg' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-gnustep-cli-new
          path: ${{ steps.manifest.outputs.log_root }}/gnustep-cli-new
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: warn

      - name: Upload Validation Output
        if: ${{ always() && inputs.upload-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-validation
          path: ${{ steps.manifest.outputs.validation_root }}
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: warn
