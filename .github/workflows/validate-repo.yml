name: validate-repo

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows-validation:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2 CLANG64 Prerequisites
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            curl
            tar
            gzip
            mingw-w64-clang-x86_64-clang

      - name: Expose MSYS2 Toolchain
        run: |
          "MSYS2_LOCATION=${{ steps.msys2.outputs.msys2-location }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'clang64\bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Bootstrap And Smoke Test gnustep-cli-new
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export GP_GNUSTEP_CLI_ROOT="$(cygpath -u '${{ runner.temp }}')/gnustep-cli-new"
          export GP_GNUSTEP_CLI_LOG_ROOT="$(cygpath -u '${{ github.workspace }}')/dist/logs/gnustep-cli-new"
          export GP_GNUSTEP_CLI_SMOKE_ROOT="$(cygpath -u '${{ runner.temp }}')/gnustep-cli-new-smoke"
          export GP_GNUSTEP_CLI_HOST_KIND="windows-msys2-clang64"
          ./scripts/ci/gnustep-cli-new-bootstrap-smoke.sh
          {
            cygpath -w "${GP_GNUSTEP_CLI_ROOT}/bin"
            cygpath -w "${GP_GNUSTEP_CLI_ROOT}/Tools"
            cygpath -w "${GP_GNUSTEP_CLI_ROOT}/System/Tools"
            cygpath -w "${GP_GNUSTEP_CLI_ROOT}/usr/bin"
            cygpath -w "${GP_GNUSTEP_CLI_ROOT}/clang64/bin"
          } >> "$GITHUB_PATH"
          {
            echo "GP_GNUSTEP_CLI_ROOT=$(cygpath -w "${GP_GNUSTEP_CLI_ROOT}")"
            echo "GP_GNUSTEP_CLI_MANIFEST_URL=${GP_GNUSTEP_CLI_MANIFEST_URL:-https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.3/release-manifest.json}"
          } >> "$GITHUB_ENV"

      - name: Validate Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command manifest-check -Manifest examples/sample-gui/package.manifest.json

      - name: Resolve Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command resolve-manifest -Manifest examples/sample-gui/package.manifest.json

      - name: Describe Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command describe -Manifest examples/sample-gui/package.manifest.json

      - name: Run Pester Regression Tests
        run: |
          ./scripts/test-repo.ps1 -CI

      - name: Run Shared Packaging Pipeline
        run: |
          ./scripts/run-packaging-pipeline.ps1 -Manifest examples/sample-gui/package.manifest.json -Backend msi -RunSmoke

      - name: Upload gnustep-cli-new Diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-gnustep-cli-new
          path: dist/logs/gnustep-cli-new
          retention-days: 7
          if-no-files-found: warn

  linux-validation:
    # The reusable workflow's runs-on-appimage default.
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl tar gzip squashfs-tools desktop-file-utils

      - name: Bootstrap And Smoke Test gnustep-cli-new
        shell: bash
        run: |
          set -euo pipefail
          export GP_GNUSTEP_CLI_ROOT="${RUNNER_TEMP}/gnustep-cli-new"
          export GP_GNUSTEP_CLI_LOG_ROOT="${GITHUB_WORKSPACE}/dist/logs/gnustep-cli-new"
          export GP_GNUSTEP_CLI_SMOKE_ROOT="${RUNNER_TEMP}/gnustep-cli-new-smoke"
          export GP_GNUSTEP_CLI_HOST_KIND="linux-ubuntu-appimage"
          ./scripts/ci/gnustep-cli-new-bootstrap-smoke.sh
          {
            echo "${GP_GNUSTEP_CLI_ROOT}/bin"
            echo "${GP_GNUSTEP_CLI_ROOT}/Tools"
            echo "${GP_GNUSTEP_CLI_ROOT}/System/Tools"
          } >> "$GITHUB_PATH"
          {
            echo "GP_GNUSTEP_CLI_ROOT=${GP_GNUSTEP_CLI_ROOT}"
            echo "GP_GNUSTEP_CLI_MANIFEST_URL=${GP_GNUSTEP_CLI_MANIFEST_URL:-https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.3/release-manifest.json}"
          } >> "$GITHUB_ENV"

      - name: Validate Linux Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command manifest-check -Manifest examples/sample-linux/package.manifest.json

      - name: Resolve Linux Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command resolve-manifest -Manifest examples/sample-linux/package.manifest.json

      - name: Describe Linux Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command describe -Manifest examples/sample-linux/package.manifest.json

      - name: Run Pester Regression Tests
        run: |
          ./scripts/test-repo.ps1 -CI

      - name: Run Shared Packaging Pipeline
        run: |
          ./scripts/run-packaging-pipeline.ps1 -Manifest examples/sample-linux/package.manifest.json -Backend appimage -RunSmoke

      - name: Smoke Test Linux Example On A Clean Host
        shell: bash
        env:
          # The fixture exits non-zero unless GNUSTEP_CONFIG_FILE reaches the bundled System/Library.
          GP_CLEAN_SMOKE_ENV: GP_FIXTURE_EXPECT_GNUSTEP_CONFIG=1
        run: |
          ./scripts/ci/appimage-clean-smoke.sh examples/sample-linux/dist/packages/SampleGNUstepLinuxApp-0.1.0-x86_64.AppImage ubuntu:24.04

      - name: Upload gnustep-cli-new Diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-gnustep-cli-new
          path: dist/logs/gnustep-cli-new
          retention-days: 7
          if-no-files-found: warn

  macos-validation:
    runs-on: macos-latest
    # One early run stalled after the pipeline had finished; cap it.
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate macOS Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command manifest-check -Manifest examples/sample-macos/package.manifest.json

      - name: Describe macOS Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command describe -Manifest examples/sample-macos/package.manifest.json -Backend dmg

      - name: Run Pester Regression Tests
        run: |
          ./scripts/test-repo.ps1 -CI

      - name: Run Shared Packaging Pipeline
        run: |
          ./scripts/run-packaging-pipeline.ps1 -Manifest examples/sample-macos/package.manifest.json -Backend dmg -RunSmoke

      - name: Upload DMG Artifacts And Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            examples/sample-macos/dist/packages
            examples/sample-macos/dist/logs
          retention-days: 7
          if-no-files-found: warn

  # The reusable workflow's dmg path, end to end, on the macOS fixture.
  macos-reusable-workflow:
    uses: ./.github/workflows/package-gnustep-app.yml
    with:
      manifest-path: examples/sample-macos/package.manifest.json
      backend: dmg
      run-validation: true
      run-smoke: true
      artifact-name: sample-macos-reusable
      artifact-retention-days: 7

  # The reusable workflow's msi path, end to end, on the GUI fixture: default
  # host setup, so the gnustep-cli-new bootstrap and its ps1 digest check run.
  windows-reusable-workflow:
    uses: ./.github/workflows/package-gnustep-app.yml
    with:
      manifest-path: examples/sample-gui/package.manifest.json
      backend: msi
      run-validation: true
      run-smoke: true
      artifact-name: sample-gui-reusable
      artifact-retention-days: 7
