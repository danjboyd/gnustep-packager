name: validate-repo

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows-validation:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2 CLANG64 Prerequisites
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            curl
            tar
            gzip
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-fontconfig
            mingw-w64-clang-x86_64-ttf-dejavu

      - name: Expose MSYS2 Toolchain
        run: |
          "MSYS2_LOCATION=${{ steps.msys2.outputs.msys2-location }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'clang64\bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Bootstrap And Smoke Test gnustep-cli-new
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export GP_GNUSTEP_CLI_ROOT="$(cygpath -u '${{ runner.temp }}')/gnustep-cli-new"
          export GP_GNUSTEP_CLI_LOG_ROOT="$(cygpath -u '${{ github.workspace }}')/dist/logs/gnustep-cli-new"
          export GP_GNUSTEP_CLI_SMOKE_ROOT="$(cygpath -u '${{ runner.temp }}')/gnustep-cli-new-smoke"
          export GP_GNUSTEP_CLI_HOST_KIND="windows-msys2-clang64"
          ./scripts/ci/gnustep-cli-new-bootstrap-smoke.sh
          {
            cygpath -w "${GP_GNUSTEP_CLI_ROOT}/bin"
            cygpath -w "${GP_GNUSTEP_CLI_ROOT}/Tools"
            cygpath -w "${GP_GNUSTEP_CLI_ROOT}/System/Tools"
            cygpath -w "${GP_GNUSTEP_CLI_ROOT}/usr/bin"
            cygpath -w "${GP_GNUSTEP_CLI_ROOT}/clang64/bin"
          } >> "$GITHUB_PATH"
          {
            echo "GP_GNUSTEP_CLI_ROOT=$(cygpath -w "${GP_GNUSTEP_CLI_ROOT}")"
            echo "GP_GNUSTEP_CLI_MANIFEST_URL=${GP_GNUSTEP_CLI_MANIFEST_URL:-https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.5/release-manifest.json}"
          } >> "$GITHUB_ENV"

      - name: Validate Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command manifest-check -Manifest examples/sample-gui/package.manifest.json

      - name: Resolve Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command resolve-manifest -Manifest examples/sample-gui/package.manifest.json

      - name: Describe Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command describe -Manifest examples/sample-gui/package.manifest.json

      # Apps build gp-update-helper with this toolchain, so a change that
      # doesn't compile or link on Windows should fail here. Built in the
      # toolchain's own MSYS2 root, where GNUstep.sh finds /clang64. The
      # helper runtime tests then run against it (GP_UPDATE_HELPER_PATH).
      - name: Build gp-update-helper
        run: |
          $root = $env:GP_GNUSTEP_CLI_ROOT
          $envExe = Join-Path $root "usr\bin\env.exe"
          if (-not (Test-Path $envExe)) { throw "No env.exe in the toolchain root $root" }
          $repo = (Resolve-Path .).Path
          $bootstrap = "if [ -f /etc/profile ]; then source /etc/profile; fi; source /clang64/share/GNUstep/Makefiles/GNUstep.sh; cd `"`$(cygpath -u '$repo')`" && make -C updater/objc/gp-update-helper"
          & $envExe MSYSTEM=CLANG64 CHERE_INVOKING=1 /usr/bin/bash -lc $bootstrap
          if ($LASTEXITCODE -ne 0) { throw "gp-update-helper did not build (exit $LASTEXITCODE)" }
          $helper = Get-ChildItem updater/objc/gp-update-helper -Filter "gp-update-helper*.exe" | Select-Object -First 1
          if (-not $helper) { throw "gp-update-helper.exe was not built" }
          "GP_UPDATE_HELPER_PATH=$($helper.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Pester Regression Tests
        run: |
          ./scripts/test-repo.ps1 -CI

      - name: Run Shared Packaging Pipeline
        run: |
          ./scripts/run-packaging-pipeline.ps1 -Manifest examples/sample-gui/package.manifest.json -Backend msi -RunSmoke

      # backends.msi.fonts.bundle end to end: the fixture bundles MSYS2's real
      # DejaVu fonts, and fontconfig, started the way the launcher starts it
      # (FONTCONFIG_FILE and FONTCONFIG_PATH at runtime\etc\fonts), must
      # list DejaVu Sans from the bundled copy, not from MSYS2's own fonts.
      - name: Check Bundled Fonts With Fontconfig
        run: |
          $install = Get-ChildItem examples/sample-gui/dist/tmp/msi -Directory | Sort-Object Name | Select-Object -Last 1 | ForEach-Object { Join-Path $_.FullName "install" }
          if (-not $install -or -not (Test-Path $install)) { throw "No MSI install tree under examples/sample-gui/dist/tmp/msi" }
          $fontDir = Join-Path $install "runtime\share\fonts\dejavu"
          $font = Get-Item (Join-Path $fontDir "DejaVuSans.ttf")
          if ($font.Length -lt 100KB) { throw "Bundled DejaVuSans.ttf is $($font.Length) bytes: the fixture staged a placeholder, not MSYS2's font" }
          $confDir = Join-Path $install "runtime\etc\fonts"
          Get-Content (Join-Path $confDir "fonts.conf") | Write-Host
          if (-not (Test-Path (Join-Path $confDir "fonts.app.conf"))) { throw "The staged MSYS2 fonts.conf was not kept as fonts.app.conf" }
          $notices = Get-Content -Raw (Join-Path $install "metadata\THIRD-PARTY-NOTICES.txt")
          if ($notices -notmatch '\[DejaVu \(font\)\]') { throw "The notice report has no DejaVu (font) entry" }
          $env:FONTCONFIG_PATH = $confDir
          $env:FONTCONFIG_FILE = Join-Path $confDir "fonts.conf"
          $fcList = Join-Path $env:MSYS2_LOCATION "clang64\bin\fc-list.exe"
          $files = @(& $fcList -f "%{file}\n" "DejaVu Sans")
          if ($LASTEXITCODE -ne 0) { throw "fc-list failed (exit $LASTEXITCODE)" }
          $files | Write-Host
          $bundled = @($files | Where-Object { $_ -and ([System.IO.Path]::GetFullPath($_)).StartsWith($fontDir, [System.StringComparison]::OrdinalIgnoreCase) })
          if ($bundled.Count -eq 0) { throw "fontconfig did not list DejaVu Sans from the bundled directory $fontDir" }
          Write-Host "fontconfig lists the bundled DejaVu Sans: $($bundled -join ', ')"

      - name: Upload gnustep-cli-new Diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-gnustep-cli-new
          path: dist/logs/gnustep-cli-new
          retention-days: 7
          if-no-files-found: warn

  linux-validation:
    # The reusable workflow's runs-on-appimage default.
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl tar gzip squashfs-tools desktop-file-utils

      - name: Bootstrap And Smoke Test gnustep-cli-new
        shell: bash
        run: |
          set -euo pipefail
          export GP_GNUSTEP_CLI_ROOT="${RUNNER_TEMP}/gnustep-cli-new"
          export GP_GNUSTEP_CLI_LOG_ROOT="${GITHUB_WORKSPACE}/dist/logs/gnustep-cli-new"
          export GP_GNUSTEP_CLI_SMOKE_ROOT="${RUNNER_TEMP}/gnustep-cli-new-smoke"
          export GP_GNUSTEP_CLI_HOST_KIND="linux-ubuntu-appimage"
          ./scripts/ci/gnustep-cli-new-bootstrap-smoke.sh
          {
            echo "${GP_GNUSTEP_CLI_ROOT}/bin"
            echo "${GP_GNUSTEP_CLI_ROOT}/Tools"
            echo "${GP_GNUSTEP_CLI_ROOT}/System/Tools"
          } >> "$GITHUB_PATH"
          {
            echo "GP_GNUSTEP_CLI_ROOT=${GP_GNUSTEP_CLI_ROOT}"
            echo "GP_GNUSTEP_CLI_MANIFEST_URL=${GP_GNUSTEP_CLI_MANIFEST_URL:-https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.5/release-manifest.json}"
          } >> "$GITHUB_ENV"

      - name: Validate Linux Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command manifest-check -Manifest examples/sample-linux/package.manifest.json

      - name: Resolve Linux Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command resolve-manifest -Manifest examples/sample-linux/package.manifest.json

      - name: Describe Linux Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command describe -Manifest examples/sample-linux/package.manifest.json

      - name: Run Pester Regression Tests
        run: |
          ./scripts/test-repo.ps1 -CI

      - name: Run Shared Packaging Pipeline
        run: |
          ./scripts/run-packaging-pipeline.ps1 -Manifest examples/sample-linux/package.manifest.json -Backend appimage -RunSmoke

      - name: Smoke Test Linux Example On A Clean Host
        shell: bash
        env:
          # The fixture exits non-zero unless GNUSTEP_CONFIG_FILE reaches the bundled System/Library.
          GP_CLEAN_SMOKE_ENV: GP_FIXTURE_EXPECT_GNUSTEP_CONFIG=1
        run: |
          ./scripts/ci/appimage-clean-smoke.sh examples/sample-linux/dist/packages/SampleGNUstepLinuxApp-0.1.0-x86_64.AppImage ubuntu:24.04

      - name: Upload gnustep-cli-new Diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-gnustep-cli-new
          path: dist/logs/gnustep-cli-new
          retention-days: 7
          if-no-files-found: warn

  linux-arm64-validation:
    # aarch64 AppImages build on an aarch64 host: appimagetool and its runtime
    # run only on their own architecture (#109).
    runs-on: ubuntu-24.04-arm
    # In a Debian trixie container: gnustep-cli-new v0.1.5's linux-arm64
    # toolchain links ICU 76, and ubuntu-24.04-arm has ICU 74, which the
    # toolchain refuses (icu_major_mismatch). Trixie has ICU 76.
    container: debian:trixie
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Install Linux Prerequisites And PowerShell
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl tar gzip git make file \
            squashfs-tools desktop-file-utils binutils procps libicu76 libssl3t64 zlib1g
          # The checkout belongs to the runner user, not the container's root.
          git config --global --add safe.directory '*'
          mkdir -p /opt/microsoft/powershell/7
          curl -fsSL https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-linux-arm64.tar.gz \
            | tar -xz -C /opt/microsoft/powershell/7
          chmod +x /opt/microsoft/powershell/7/pwsh
          ln -sf /opt/microsoft/powershell/7/pwsh /usr/bin/pwsh
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap And Smoke Test gnustep-cli-new
        shell: bash
        run: |
          set -euo pipefail
          export GP_GNUSTEP_CLI_ROOT="${RUNNER_TEMP}/gnustep-cli-new"
          export GP_GNUSTEP_CLI_LOG_ROOT="${GITHUB_WORKSPACE}/dist/logs/gnustep-cli-new"
          export GP_GNUSTEP_CLI_SMOKE_ROOT="${RUNNER_TEMP}/gnustep-cli-new-smoke"
          export GP_GNUSTEP_CLI_HOST_KIND="linux-debian-trixie-arm64-container"
          ./scripts/ci/gnustep-cli-new-bootstrap-smoke.sh
          {
            echo "${GP_GNUSTEP_CLI_ROOT}/bin"
            echo "${GP_GNUSTEP_CLI_ROOT}/Tools"
            echo "${GP_GNUSTEP_CLI_ROOT}/System/Tools"
          } >> "$GITHUB_PATH"
          {
            echo "GP_GNUSTEP_CLI_ROOT=${GP_GNUSTEP_CLI_ROOT}"
            echo "GP_GNUSTEP_CLI_MANIFEST_URL=${GP_GNUSTEP_CLI_MANIFEST_URL:-https://github.com/danjboyd/gnustep-cli-new/releases/download/v0.1.5/release-manifest.json}"
          } >> "$GITHUB_ENV"

      - name: Validate Linux Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command manifest-check -Manifest examples/sample-linux/package.manifest.json

      - name: Resolve Linux Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command resolve-manifest -Manifest examples/sample-linux/package.manifest.json

      - name: Describe Linux Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command describe -Manifest examples/sample-linux/package.manifest.json

      - name: Run Pester Regression Tests
        run: |
          ./scripts/test-repo.ps1 -CI

      - name: Run Shared Packaging Pipeline
        run: |
          ./scripts/run-packaging-pipeline.ps1 -Manifest examples/sample-linux/package.manifest.json -Backend appimage -RunSmoke

      - name: Check The aarch64 Artifact
        shell: bash
        run: |
          set -euo pipefail
          appimage=examples/sample-linux/dist/packages/SampleGNUstepLinuxApp-0.1.0-aarch64.AppImage
          file "$appimage" | tee /dev/stderr | grep -q 'ARM aarch64'
          # The runtime and every bundled ELF must be aarch64.
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --appimage-extract >/dev/null
          if find squashfs-root -type f -exec file {} + | grep 'ELF' | grep -v 'aarch64'; then
            echo "Non-aarch64 ELF files in the AppImage" >&2
            exit 1
          fi
          # The oldest glibc a host can have: the newest GLIBC_ symbol version any
          # bundled ELF needs. glibc isn't bundled, so this is the AppImage's floor.
          # The sample app and its tools are shell scripts, so this AppImage's only
          # ELF may be its runtime, which is outside squashfs-root; say so.
          versions=$(mktemp); elfs=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q '^ELF'; then
              elfs=$((elfs + 1))
              readelf -V --wide "$f" 2>/dev/null | grep -o 'GLIBC_[0-9][0-9.]*' >> "$versions" || true
            fi
          done < <(find squashfs-root -type f -print0)
          floor=$(sort -u -V "$versions" | tail -n 1)
          echo "ELF files in the payload: ${elfs}; glibc floor: ${floor:-none (no ELF payload)}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload The aarch64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-appimage
          path: examples/sample-linux/dist/packages/SampleGNUstepLinuxApp-0.1.0-aarch64.AppImage
          retention-days: 7
          if-no-files-found: error

      - name: Upload gnustep-cli-new Diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-gnustep-cli-new
          path: dist/logs/gnustep-cli-new
          retention-days: 7
          if-no-files-found: warn

  linux-arm64-clean-hosts:
    # Where the aarch64 AppImage built above runs. It's built in debian:trixie,
    # because the toolchain is Debian-scoped (ICU 76, glibc 2.41), so hosts with
    # an older glibc may refuse it. Each host is a separate step, and a failure
    # is reported without failing the run: this records what works.
    needs: linux-arm64-validation
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:trixie", "fedora:42"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download The aarch64 AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-appimage
          path: arm64-appimage

      - name: Clean-Host Smoke
        shell: bash
        run: |
          set -euo pipefail
          chmod +x arm64-appimage/*.AppImage
          ./scripts/ci/appimage-clean-smoke.sh arm64-appimage/SampleGNUstepLinuxApp-0.1.0-aarch64.AppImage "${{ matrix.image }}"

  macos-validation:
    runs-on: macos-latest
    # One early run stalled after the pipeline had finished; cap it.
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate macOS Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command manifest-check -Manifest examples/sample-macos/package.manifest.json

      - name: Describe macOS Example Manifest
        run: |
          ./scripts/gnustep-packager.ps1 -Command describe -Manifest examples/sample-macos/package.manifest.json -Backend dmg

      - name: Run Pester Regression Tests
        run: |
          ./scripts/test-repo.ps1 -CI

      - name: Run Shared Packaging Pipeline
        run: |
          ./scripts/run-packaging-pipeline.ps1 -Manifest examples/sample-macos/package.manifest.json -Backend dmg -RunSmoke

      - name: Upload DMG Artifacts And Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            examples/sample-macos/dist/packages
            examples/sample-macos/dist/logs
          retention-days: 7
          if-no-files-found: warn

  # The reusable workflow's dmg path, end to end, on the macOS fixture.
  macos-reusable-workflow:
    uses: ./.github/workflows/package-gnustep-app.yml
    with:
      manifest-path: examples/sample-macos/package.manifest.json
      backend: dmg
      run-validation: true
      run-smoke: true
      artifact-name: sample-macos-reusable
      artifact-retention-days: 7

  # The reusable workflow's msi path, end to end, on the GUI fixture: default
  # host setup, so the gnustep-cli-new bootstrap and its ps1 digest check run.
  windows-reusable-workflow:
    uses: ./.github/workflows/package-gnustep-app.yml
    with:
      manifest-path: examples/sample-gui/package.manifest.json
      backend: msi
      run-validation: true
      run-smoke: true
      artifact-name: sample-gui-reusable
      artifact-retention-days: 7

  # The reusable workflow's appimage path, end to end, on the Linux fixture:
  # default host setup (the gnustep-cli-new bootstrap and its digest check),
  # then a launch in a clean container with no GNUstep installed. With the
  # dmg and msi jobs above, every backend builds one installer through the
  # same entry point consumers use.
  linux-reusable-workflow:
    uses: ./.github/workflows/package-gnustep-app.yml
    with:
      manifest-path: examples/sample-linux/package.manifest.json
      backend: appimage
      run-validation: true
      run-smoke: true
      appimage-clean-smoke-image: ubuntu:24.04
      artifact-name: sample-linux-reusable
      artifact-retention-days: 7
